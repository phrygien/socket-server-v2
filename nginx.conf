# ==============================================================================
# CONFIGURATION NGINX REVERSE PROXY WEBSOCKET - AUCTAV
# Fichier cible : /etc/nginx/sites-available/socket-auctav.astucom.com.conf
# ==============================================================================

# Définition du cluster amont (Node.js Socket.IO)
# Si plusieurs instances sont lancées via PM2 ou Docker, 'ip_hash' garantit
# l'affinité de session pendant la phase de négociation HTTP Long-Polling Engine.IO
upstream auctav_socket_backend {
    ip_hash;
    server 127.0.0.1:3000;
    keepalive 64;
}

# 1. Redirection automatique HTTP (Port 80) -> HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name socket-auctav.astucom.com;

    # Défi Let's Encrypt / Certbot pour renouvellement SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Serveur Sécurisé HTTPS (Port 443)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name socket-auctav.astucom.com;

    # Certificats SSL (chemins Let's Encrypt standard)
    ssl_certificate /etc/letsencrypt/live/socket-auctav.astucom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/socket-auctav.astucom.com/privkey.pem;

    # Protocoles et suites de chiffrement sécurisées
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Optimisation du cache de session SSL
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # En-têtes de sécurité recommandés
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Taille maximale des corps de requêtes (1 Mo suffisant pour Socket.IO)
    client_max_body_size 1M;

    # --------------------------------------------------------------------------
    # Reverse Proxy Socket.IO (/socket.io/)
    # Gère à la fois le transport WebSocket et le fallback HTTP Long-Polling
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://auctav_socket_backend;

        # Indispensable pour le protocole WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Transmission des en-têtes d'origine et d'identification client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Désactivation du buffering pour latence ultra-faible (crucial enchères direct)
        proxy_buffering off;
        proxy_cache off;

        # Timeouts longs pour maintenir les connexions WebSocket ouvertes sans coupure
        proxy_connect_timeout 60s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # Endpoint de monitoring santé (/health)
    # --------------------------------------------------------------------------
    location /health {
        proxy_pass http://auctav_socket_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        access_log off; # Évite d'encombrer les logs d'accès
    }

    # Journalisation spécifique
    access_log /var/log/nginx/auctav_socket_access.log;
    error_log /var/log/nginx/auctav_socket_error.log warn;
}
